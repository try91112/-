<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Миша</title>
  <style>
    /* Убираем отступы и делаем черный фон на весь экран */
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    html, body {
      background-color: #000000; /* Абсолютно черный фон */
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden; /* Убираем любые полосы прокрутки */
    }

    /* Центрируем кнопку */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Стили для кнопки */
    .center-btn {
      padding: 20px 50px;
      font-size: 1.5rem;
      font-weight: 700;
      background-color: #ffffff; /* Белая кнопка */
      color: #000000; /* Черный текст */
      border: 2px solid #ffffff;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .center-btn:hover {
      background-color: #000000; /* При наведении кнопка становится черной */
      color: #ffffff; /* А текст белым */
    }

    /* Стили для бесконечного появления имен */
    #mishaContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      z-index: 9999;
      display: none; 
      overflow: hidden;
    }

    .misha-name {
      position: absolute;
      color: #ffffff;
      font-weight: 700;
      white-space: nowrap;
      opacity: 0;
      animation: popIn 0.5s forwards;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.3); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Единственная кнопка на сайте -->
  <button id="mishaBtn" class="center-btn">Нажми на меня</button>

  <!-- Контейнер для имен -->
  <div id="mishaContainer"></div>

  <script>
    const btn = document.getElementById('mishaBtn');
    const container = document.getElementById('mishaContainer');
    let isSpamming = false;

    btn.addEventListener('click', function() {
      if (isSpamming) return;
      isSpamming = true;

      // Показываем контейнер на весь экран
      container.style.display = 'block';
      
      function createName() {
        const span = document.createElement('span');
        span.textContent = 'Миша';
        span.className = 'misha-name';
        
        const top = Math.random() * 100;
        const left = Math.random() * 100;
        span.style.top = top + '%';
        span.style.left = left + '%';
        
        const size = Math.random() * 3 + 1;
        span.style.fontSize = size + 'rem';
        
        const rotate = Math.random() * 360;
        span.style.transform = `rotate(${rotate}deg)`;

        container.appendChild(span);
      }

      // Создаем имена бесконечно
      setInterval(createName, 30);
    });
  </script>
</body>
</html>
